name: CI

on:
  push:
    paths:
      - 'Canto/**'
  pull_request:
    paths:
      - 'Canto/**'

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Canto/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: pytest tests/ -v
      - run: ruff check app tests

  content:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Canto
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements.txt
      - run: python -m content.scripts.validate_check

  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Canto/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
